<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fbfaf7"/><rect width="18" height="900" fill="#237b66"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="75" font-size="20" fill="#237b66" font-weight="normal">TraceRisk  /  授信前调查助手</text><text x="70" y="155" font-size="44" fill="#173d47" font-weight="bold">不同结果，对应不同下一步</text><text x="70" y="210" font-size="24" fill="#69787c" font-weight="normal">应用价值  /  让每种输出都能引导调查人员采取行动</text><rect x="70" y="290" width="460" height="330" rx="8" fill="#e4eee9"/><text x="95" y="355" font-size="29" fill="#173d47" font-weight="bold">多项规则命中</text><text x="95" y="440" font-size="25" fill="#173d47" font-weight="normal">打开引用、核实关键事实</text><text x="95" y="510" font-size="24" fill="#69787c" font-weight="normal">厘清事件状态与风险方向</text><rect x="570" y="290" width="460" height="330" rx="8" fill="#e4eee9"/><text x="595" y="355" font-size="29" fill="#173d47" font-weight="bold">零分但来源不足</text><text x="595" y="440" font-size="25" fill="#173d47" font-weight="normal">补查资料、记录覆盖限制</text><text x="595" y="510" font-size="24" fill="#69787c" font-weight="normal">不能直接判为安全</text><rect x="1070" y="290" width="460" height="330" rx="8" fill="#e4eee9"/><text x="1095" y="355" font-size="29" fill="#173d47" font-weight="bold">案件结案或进入执行</text><text x="1095" y="440" font-size="25" fill="#173d47" font-weight="normal">更新状态、核实回款进展</text><text x="1095" y="510" font-size="24" fill="#69787c" font-weight="normal">规则归零不等于追偿结束</text><text x="70" y="720" font-size="31" fill="#173d47" font-weight="normal">证据容易查找  ·  分歧容易发现  ·  复核与报告容易追溯</text><text x="70" y="780" font-size="24" fill="#69787c" font-weight="normal">展示流程价值；真实业务效果和真人效率待试用测量。</text><text x="70" y="855" font-size="19" fill="#69787c" font-weight="normal">演示样例，仅作功能展示</text><text x="1460" y="855" font-size="22" fill="#237b66" font-weight="normal">06</text></g></svg>