<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fbfaf7"/><rect width="18" height="900" fill="#237b66"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="75" font-size="20" fill="#237b66" font-weight="normal">TraceRisk  /  授信前调查助手</text><text x="70" y="155" font-size="44" fill="#173d47" font-weight="bold">四个调查问题，对应四项设计</text><text x="70" y="210" font-size="24" fill="#69787c" font-weight="normal">问题理解  /  输出事实、命中、待核实事项与复核建议</text><rect x="70" y="280" width="650" height="95" rx="8" fill="#e4eee9"/><text x="95" y="341" font-size="29" fill="#173d47" font-weight="normal">资料分散，查找耗时</text><text x="755" y="341" font-size="33" fill="#173d47" font-weight="normal">→</text><rect x="830" y="280" width="700" height="95" rx="8" fill="#edf0f2"/><text x="860" y="341" font-size="29" fill="#173d47" font-weight="normal">统一来源与证据结构</text><rect x="70" y="400" width="650" height="95" rx="8" fill="#e4eee9"/><text x="95" y="461" font-size="29" fill="#173d47" font-weight="normal">同名企业、历史状态混淆</text><text x="755" y="461" font-size="33" fill="#173d47" font-weight="normal">→</text><rect x="830" y="400" width="700" height="95" rx="8" fill="#edf0f2"/><text x="860" y="461" font-size="29" fill="#173d47" font-weight="normal">企业标识与调查基准日约束</text><rect x="70" y="520" width="650" height="95" rx="8" fill="#e4eee9"/><text x="95" y="581" font-size="29" fill="#173d47" font-weight="normal">模型解释缺少依据</text><text x="755" y="581" font-size="33" fill="#173d47" font-weight="normal">→</text><rect x="830" y="520" width="700" height="95" rx="8" fill="#edf0f2"/><text x="860" y="581" font-size="29" fill="#173d47" font-weight="normal">冻结引用与支持校验</text><rect x="70" y="640" width="650" height="95" rx="8" fill="#e4eee9"/><text x="95" y="701" font-size="29" fill="#173d47" font-weight="normal">资料不足、来源说法不一致</text><text x="755" y="701" font-size="33" fill="#173d47" font-weight="normal">→</text><rect x="830" y="640" width="700" height="95" rx="8" fill="#edf0f2"/><text x="860" y="701" font-size="29" fill="#173d47" font-weight="normal">显式警示与人工复核</text><text x="70" y="855" font-size="19" fill="#69787c" font-weight="normal">演示样例，仅作功能展示</text><text x="1460" y="855" font-size="22" fill="#237b66" font-weight="normal">03</text></g></svg>