<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="100%" height="100%" fill="#fbfaf7"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="65" y="78" font-size="38" fill="#173d47" font-weight="bold">应复核召回提高，同时增加保守复核</text><text x="65" y="135" font-size="25" fill="#173d47" font-weight="normal">相同响应离线回放 · 合成40例 · 只比较路由变化</text><text x="65" y="205" font-size="28" fill="#173d47" font-weight="bold">应复核进入复核</text><text x="75" y="262" font-size="22" fill="#173d47" font-weight="normal">历史</text><rect x="170" y="230" width="90.0" height="45" rx="8" fill="#8b9caa"/><text x="285.0" y="261" font-size="25" fill="#173d47" font-weight="normal">1/10</text><text x="75" y="327" font-size="22" fill="#173d47" font-weight="normal">回放</text><rect x="170" y="295" width="810.0" height="45" rx="8" fill="#237b66"/><text x="1005.0" y="326" font-size="25" fill="#173d47" font-weight="normal">9/10</text><text x="65" y="415" font-size="28" fill="#173d47" font-weight="bold">非应复核额外复核</text><text x="75" y="472" font-size="22" fill="#173d47" font-weight="normal">历史</text><rect x="170" y="440" width="2" height="45" rx="8" fill="#8b9caa"/><text x="195.0" y="471" font-size="25" fill="#173d47" font-weight="normal">0/30</text><text x="75" y="537" font-size="22" fill="#173d47" font-weight="normal">回放</text><rect x="170" y="505" width="450.0" height="45" rx="8" fill="#237b66"/><text x="645.0" y="536" font-size="25" fill="#173d47" font-weight="normal">15/30</text><text x="65" y="695" font-size="25" fill="#173d47" font-weight="normal">仍有1例应复核因支持性硬错误被拒绝；额外复核增加工作量。</text><text x="65" y="765" font-size="18" fill="#5b6970" font-weight="normal">E04｜n=40，历史相同响应；不能推出模型输出或真实业务准确率改善。</text></g></svg>