<text x="91" y="279" font-size="23" fill="#237b66" font-weight="700">01</text>
<rect x="823" y="258" width="1" height="128" rx="0" fill="#dae5de"/>
<text x="136" y="277" font-size="22" fill="#173d47">请对远景精工（合成）有限公司开展截至2026年9月11日的授信</text>
<text x="136" y="309" font-size="22" fill="#173d47">前调查，汇总经营、司法、舆情和知识产权方面的规则命中、对应证据</text>
<text x="136" y="341" font-size="22" fill="#173d47">及需要人工核实的事项。</text>
<text x="850" y="276" font-size="20" fill="#173d47">规则合计95分。待人工复核的调查结果。工商规则（基准日仍有效的</text>
<text x="850" y="303" font-size="20" fill="#173d47">经营异常）命中，计25分。知识产权规则（核心专利失效或存在权属</text>
