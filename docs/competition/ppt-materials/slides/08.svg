<text x="136" y="457" font-size="22" fill="#173d47">请调查海晟服务（合成）有限公司截至2026年9月11日的情况。</text>
<text x="136" y="489" font-size="22" fill="#173d47">若规则分为0，能否认为没有风险？请指出缺失或不可用的来源、影响</text>
<text x="136" y="521" font-size="22" fill="#173d47">判断的限制和下一步核查事项。</text>
<text x="850" y="456" font-size="20" fill="#173d47">工商来源不可用。知识产权来源已过期。规则分0分不代表安全。本次</text>
