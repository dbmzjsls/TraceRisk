<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fbfaf7"/><rect width="18" height="900" fill="#237b66"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="75" font-size="20" fill="#237b66" font-weight="normal">TraceRisk  /  授信前调查助手</text><text x="70" y="155" font-size="44" fill="#173d47" font-weight="bold">用成功与反例检查分析逻辑</text><text x="70" y="210" font-size="24" fill="#69787c" font-weight="normal">逻辑论证  /  不只看能生成什么，还看什么时候应当停下来</text><rect x="70" y="280" width="460" height="180" rx="8" fill="#e4eee9"/><text x="95" y="342" font-size="31" fill="#173d47" font-weight="bold">明确事实</text><text x="95" y="405" font-size="24" fill="#173d47" font-weight="normal">证据是否足以支持结论</text><rect x="570" y="280" width="460" height="180" rx="8" fill="#e4eee9"/><text x="595" y="342" font-size="31" fill="#173d47" font-weight="bold">跨企业干扰</text><text x="595" y="405" font-size="24" fill="#173d47" font-weight="normal">他人材料能否被排除</text><rect x="1070" y="280" width="460" height="180" rx="8" fill="#e4eee9"/><text x="1095" y="342" font-size="31" fill="#173d47" font-weight="bold">时间更新</text><text x="1095" y="405" font-size="24" fill="#173d47" font-weight="normal">新状态是否替代旧状态</text><rect x="70" y="500" width="460" height="180" rx="8" fill="#e4eee9"/><text x="95" y="562" font-size="31" fill="#173d47" font-weight="bold">跨源冲突</text><text x="95" y="625" font-size="24" fill="#173d47" font-weight="normal">分歧是否保留并转复核</text><rect x="570" y="500" width="460" height="180" rx="8" fill="#e4eee9"/><text x="595" y="562" font-size="31" fill="#173d47" font-weight="bold">来源缺失</text><text x="595" y="625" font-size="24" fill="#173d47" font-weight="normal">是否提示补充资料</text><rect x="1070" y="500" width="460" height="180" rx="8" fill="#e4eee9"/><text x="1095" y="562" font-size="31" fill="#173d47" font-weight="bold">错误引用</text><text x="1095" y="625" font-size="24" fill="#173d47" font-weight="normal">能否阻止无依据放行</text><text x="70" y="780" font-size="25" fill="#69787c" font-weight="normal">六类各2例：展示验证设计；不作为新生产v2质量评测结果。</text><text x="70" y="855" font-size="19" fill="#69787c" font-weight="normal">演示样例，仅作功能展示</text><text x="1460" y="855" font-size="22" fill="#237b66" font-weight="normal">04</text></g></svg>