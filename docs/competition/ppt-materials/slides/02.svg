<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fbfaf7"/><rect width="18" height="900" fill="#237b66"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="70" y="75" font-size="20" fill="#237b66" font-weight="normal">TraceRisk  /  授信前调查助手</text><text x="70" y="155" font-size="44" fill="#173d47" font-weight="bold">从一份材料到一份报告</text><text x="70" y="210" font-size="24" fill="#69787c" font-weight="normal">知识使用  /  流程示意，不代表本批真实资料已接入</text><rect x="70" y="310" width="215" height="190" rx="8" fill="#e4eee9"/><text x="93" y="380" font-size="29" fill="#173d47" font-weight="bold">资料整理</text><text x="93" y="445" font-size="24" fill="#173d47" font-weight="normal">保留原文</text><text x="290" y="410" font-size="27" fill="#173d47" font-weight="normal">→</text><rect x="320" y="310" width="215" height="190" rx="8" fill="#e4eee9"/><text x="343" y="380" font-size="29" fill="#173d47" font-weight="bold">字段提取</text><text x="343" y="445" font-size="24" fill="#173d47" font-weight="normal">主体与状态</text><text x="540" y="410" font-size="27" fill="#173d47" font-weight="normal">→</text><rect x="570" y="310" width="215" height="190" rx="8" fill="#e4eee9"/><text x="593" y="380" font-size="29" fill="#173d47" font-weight="bold">片段索引</text><text x="593" y="445" font-size="24" fill="#173d47" font-weight="normal">ID与哈希</text><text x="790" y="410" font-size="27" fill="#173d47" font-weight="normal">→</text><rect x="820" y="310" width="215" height="190" rx="8" fill="#e4eee9"/><text x="843" y="380" font-size="29" fill="#173d47" font-weight="bold">检索引用</text><text x="843" y="445" font-size="24" fill="#173d47" font-weight="normal">企业与时间</text><text x="1040" y="410" font-size="27" fill="#173d47" font-weight="normal">→</text><rect x="1070" y="310" width="215" height="190" rx="8" fill="#e4eee9"/><text x="1093" y="380" font-size="29" fill="#173d47" font-weight="bold">人工复核</text><text x="1093" y="445" font-size="24" fill="#173d47" font-weight="normal">处理分歧</text><text x="1290" y="410" font-size="27" fill="#173d47" font-weight="normal">→</text><rect x="1320" y="310" width="215" height="190" rx="8" fill="#e4eee9"/><text x="1343" y="380" font-size="29" fill="#173d47" font-weight="bold">报告归档</text><text x="1343" y="445" font-size="24" fill="#173d47" font-weight="normal">保存版本</text><rect x="70" y="605" width="1460" height="145" rx="8" fill="#173d47"/><text x="100" y="660" font-size="30" fill="white" font-weight="normal">示例：案件未结 → 司法规则命中 → 引用原文 → 人工核实</text><text x="100" y="714" font-size="25" fill="#d9e9e3" font-weight="normal">结论、证据与人工决定保留关联，查看结果时可以回到依据。</text><text x="70" y="855" font-size="19" fill="#69787c" font-weight="normal">演示样例，仅作功能展示</text><text x="1460" y="855" font-size="22" fill="#237b66" font-weight="normal">02</text></g></svg>